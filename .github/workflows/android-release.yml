name: Android APK release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run android:sync
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Android signing configuration
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          configured=0
          provided=0
          for value in \
            "$ANDROID_KEYSTORE_BASE64" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then
              provided=$((provided + 1))
            fi
          done
          if [[ "$provided" -eq 4 ]]; then
            configured=1
          elif [[ "$provided" -ne 0 ]]; then
            echo "Android signing secrets are partially configured; provide all four secrets or remove them all." >&2
            exit 1
          fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
      - name: Restore Android signing key
        if: ${{ steps.signing.outputs.configured == '1' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kedu-release.jks"
      - name: Build signed release APK
        if: ${{ steps.signing.outputs.configured == '1' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kedu-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && bash ./gradlew assembleRelease
      - name: Build debug APK when release signing is not configured
        if: ${{ steps.signing.outputs.configured == '0' }}
        run: cd android && bash ./gradlew assembleDebug
      - name: Upload signed release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.configured == '1'
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          name: Kedu Focus ${{ github.ref_name }}
          generate_release_notes: true
      - name: Upload debug APK fallback
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.configured == '0'
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: Kedu Focus ${{ github.ref_name }} (debug)
          generate_release_notes: true
